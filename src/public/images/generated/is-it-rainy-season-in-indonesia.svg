<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="rs-title rs-desc">
  <title id="rs-title">Central Java rainy season by month, with the clear-morning window</title>
  <desc id="rs-desc">A twelve-month band for Central Java. Rain intensity is highest in December, January and February, eases through March and April, and falls to its lowest in July and August before building again from October. The season strip beneath marks wet season from November to April and dry season from May to October. A day-timeline overlay at the foot shows that even in the wet season the hours from about 04:00 to 14:00 are usually clear, with downpours most likely from mid-afternoon onward, which is why the Borobudur structure climb from 08:30 sits inside the clear window.</desc>
  <style>
    .f{font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif;}
    .hd{font-size:20px;font-weight:700;}
    .sub{font-size:12px;}
    .mo{font-size:11.5px;font-weight:600;}
    .lg{font-size:11.5px;}
    .bandtxt{font-size:12px;font-weight:700;letter-spacing:.08em;}
    .tick{font-size:11px;}
  </style>

  <rect x="1" y="1" width="898" height="468" rx="14" fill="#f4f5f5" stroke="#dde2e4"/>

  <text x="40" y="42" class="f hd" fill="#15181b">Is it rainy season? Central Java, month by month</text>
  <text x="40" y="64" class="f sub" fill="#454e55">Dry May to October, driest July and August. Wet November to April, wettest December to February.</text>

  <!-- legend -->
  <rect x="646" y="80" width="11" height="11" rx="2" fill="#4a5761"/>
  <text x="663" y="90" class="f lg" fill="#454e55">Wet months</text>
  <rect x="742" y="80" width="11" height="11" rx="2" fill="#a8792f"/>
  <text x="759" y="90" class="f lg" fill="#454e55">Dry months</text>

  <text x="40" y="90" class="f lg" fill="#454e55">Relative rain intensity</text>

  <!-- baseline -->
  <line x1="60" y1="300" x2="852" y2="300" stroke="#dde2e4" stroke-width="1"/>

  <!-- bars: 12 columns of 66px from x=60 -->
  <rect x="72" y="150" width="42" height="150" rx="3" fill="#4a5761"/>
  <rect x="138" y="150" width="42" height="150" rx="3" fill="#4a5761"/>
  <rect x="204" y="185" width="42" height="115" rx="3" fill="#4a5761"/>
  <rect x="270" y="220" width="42" height="80" rx="3" fill="#4a5761"/>
  <rect x="336" y="255" width="42" height="45" rx="3" fill="#a8792f"/>
  <rect x="402" y="272" width="42" height="28" rx="3" fill="#a8792f"/>
  <rect x="468" y="286" width="42" height="14" rx="3" fill="#a8792f"/>
  <rect x="534" y="286" width="42" height="14" rx="3" fill="#a8792f"/>
  <rect x="600" y="270" width="42" height="30" rx="3" fill="#a8792f"/>
  <rect x="666" y="245" width="42" height="55" rx="3" fill="#a8792f"/>
  <rect x="732" y="200" width="42" height="100" rx="3" fill="#4a5761"/>
  <rect x="798" y="155" width="42" height="145" rx="3" fill="#4a5761"/>

  <!-- peak / trough callouts -->
  <text x="156" y="140" text-anchor="middle" class="f lg" fill="#d4552a">Peak of the wet season</text>
  <text x="522" y="276" text-anchor="middle" class="f lg" fill="#454e55">Driest</text>

  <!-- month labels -->
  <text x="93" y="320" text-anchor="middle" class="f mo" fill="#15181b">JAN</text>
  <text x="159" y="320" text-anchor="middle" class="f mo" fill="#15181b">FEB</text>
  <text x="225" y="320" text-anchor="middle" class="f mo" fill="#15181b">MAR</text>
  <text x="291" y="320" text-anchor="middle" class="f mo" fill="#15181b">APR</text>
  <text x="357" y="320" text-anchor="middle" class="f mo" fill="#15181b">MAY</text>
  <text x="423" y="320" text-anchor="middle" class="f mo" fill="#15181b">JUN</text>
  <text x="489" y="320" text-anchor="middle" class="f mo" fill="#15181b">JUL</text>
  <text x="555" y="320" text-anchor="middle" class="f mo" fill="#15181b">AUG</text>
  <text x="621" y="320" text-anchor="middle" class="f mo" fill="#15181b">SEP</text>
  <text x="687" y="320" text-anchor="middle" class="f mo" fill="#15181b">OCT</text>
  <text x="753" y="320" text-anchor="middle" class="f mo" fill="#15181b">NOV</text>
  <text x="819" y="320" text-anchor="middle" class="f mo" fill="#15181b">DEC</text>

  <!-- season strip -->
  <rect x="60" y="330" width="264" height="26" rx="4" fill="#4a5761"/>
  <text x="192" y="348" text-anchor="middle" class="f bandtxt" fill="#ffffff">WET SEASON</text>
  <rect x="324" y="330" width="396" height="26" rx="4" fill="#a8792f"/>
  <text x="522" y="348" text-anchor="middle" class="f bandtxt" fill="#ffffff">DRY SEASON &#183; MAY TO OCTOBER</text>
  <rect x="720" y="330" width="132" height="26" rx="4" fill="#4a5761"/>
  <text x="786" y="348" text-anchor="middle" class="f bandtxt" fill="#ffffff">WET AGAIN</text>

  <!-- day overlay -->
  <text x="40" y="390" class="f sub" fill="#454e55">The hours that matter, wet season included</text>
  <text x="852" y="390" text-anchor="end" class="f sub" fill="#454e55">Rain builds through the day and breaks after about 14:00</text>

  <rect x="60" y="400" width="566" height="30" rx="4" fill="#ffffff" stroke="#a8792f" stroke-width="1.5"/>
  <text x="343" y="420" text-anchor="middle" class="f mo" fill="#15181b">USUALLY CLEAR &#183; DAWN TO EARLY AFTERNOON</text>
  <rect x="626" y="400" width="226" height="30" rx="4" fill="#15181b"/>
  <text x="739" y="420" text-anchor="middle" class="f mo" fill="#ffffff">DOWNPOUR LIKELY</text>

  <text x="60" y="448" class="f tick" fill="#454e55">04:00</text>
  <text x="238" y="448" text-anchor="middle" class="f tick" fill="#454e55">08:30 climb opens</text>
  <text x="626" y="448" text-anchor="middle" class="f tick" fill="#454e55">14:00</text>
  <text x="852" y="448" text-anchor="end" class="f tick" fill="#454e55">18:00</text>
</svg>
