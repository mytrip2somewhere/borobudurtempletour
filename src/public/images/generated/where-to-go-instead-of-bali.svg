<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d">
  <title id="t">Where to go instead of Bali: a decision flow</title>
  <desc id="d">A decision flow starting from the question of what you actually want from the trip, routing to Java and Yogyakarta for temples and culture, Lombok for quieter beaches, Flores and Komodo for dragons and diving, and Sumatra for jungle, with the travel effort from Bali shown for each.</desc>
  <style>
    .k { font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif; font-weight:700; font-size:13px; letter-spacing:.06em; }
    .h { font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif; font-weight:700; font-size:20px; }
    .q { font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif; font-weight:700; font-size:15px; }
    .d { font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif; font-weight:700; font-size:16px; }
    .s { font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif; font-weight:400; font-size:12px; }
    .e { font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif; font-weight:600; font-size:12px; }
  </style>

  <rect x="1" y="1" width="898" height="468" rx="14" fill="#f4f5f5" stroke="#dde2e4"/>

  <text class="k" x="40" y="40" fill="#a8792f">START WITH THE HONEST QUESTION</text>
  <text class="h" x="40" y="68" fill="#15181b">What did you actually want from this trip?</text>

  <!-- spine -->
  <line x1="112" y1="96" x2="112" y2="410" stroke="#4a5761" stroke-width="2"/>

  <!-- Row 1: Java -->
  <line x1="112" y1="136" x2="180" y2="136" stroke="#d4552a" stroke-width="2"/>
  <circle cx="112" cy="136" r="5" fill="#d4552a"/>
  <text class="q" x="128" y="104" fill="#454e55">"Temples, culture, real history"</text>
  <rect x="180" y="112" width="380" height="48" rx="6" fill="#15181b"/>
  <text class="d" x="200" y="132" fill="#ffffff">Yogyakarta, Java</text>
  <text class="s" x="200" y="150" fill="#ffffff">Borobudur + Prambanan, an hour apart. Two UNESCO sites.</text>
  <text class="e" x="860" y="132" fill="#d4552a" text-anchor="end">Direct flight, about 1h35</text>
  <text class="s" x="860" y="150" fill="#454e55" text-anchor="end">the easy swap: costs you one morning</text>

  <!-- Row 2: Lombok -->
  <line x1="112" y1="216" x2="180" y2="216" stroke="#4a5761" stroke-width="2"/>
  <circle cx="112" cy="216" r="5" fill="#4a5761"/>
  <text class="q" x="128" y="184" fill="#454e55">"The same beaches, fewer people"</text>
  <rect x="180" y="192" width="380" height="48" rx="6" fill="#4a5761"/>
  <text class="d" x="200" y="212" fill="#ffffff">Lombok &amp; the Gilis</text>
  <text class="s" x="200" y="230" fill="#ffffff">~430,000 international arrivals in 2024, against Bali's ~6.9m.</text>
  <text class="e" x="860" y="212" fill="#454e55" text-anchor="end">Short flight or fast boat</text>
  <text class="s" x="860" y="230" fill="#454e55" text-anchor="end">thinner food and hotel scene</text>

  <!-- Row 3: Flores -->
  <line x1="112" y1="296" x2="180" y2="296" stroke="#4a5761" stroke-width="2"/>
  <circle cx="112" cy="296" r="5" fill="#4a5761"/>
  <text class="q" x="128" y="264" fill="#454e55">"Wildlife and diving"</text>
  <rect x="180" y="272" width="380" height="48" rx="6" fill="#4a5761"/>
  <text class="d" x="200" y="292" fill="#ffffff">Flores &amp; Komodo</text>
  <text class="s" x="200" y="310" fill="#ffffff">Komodo National Park drew roughly 432,000 visitors in 2025.</text>
  <text class="e" x="860" y="292" fill="#454e55" text-anchor="end">Flight, then multi-day boats</text>
  <text class="s" x="860" y="310" fill="#454e55" text-anchor="end">needs four spare days, not a weekend</text>

  <!-- Row 4: Sumatra -->
  <line x1="112" y1="376" x2="180" y2="376" stroke="#4a5761" stroke-width="2"/>
  <circle cx="112" cy="376" r="5" fill="#4a5761"/>
  <text class="q" x="128" y="344" fill="#454e55">"Jungle, orangutans, a real journey"</text>
  <rect x="180" y="352" width="380" height="48" rx="6" fill="#4a5761"/>
  <text class="d" x="200" y="372" fill="#ffffff">Sumatra</text>
  <text class="s" x="200" y="390" fill="#ffffff">Lake Toba, wild orangutans, Padang food.</text>
  <text class="e" x="860" y="372" fill="#454e55" text-anchor="end">Long flight, long overland</text>
  <text class="s" x="860" y="390" fill="#454e55" text-anchor="end">a two-week trip, not a detour</text>

  <!-- bottom note -->
  <line x1="40" y1="424" x2="860" y2="424" stroke="#dde2e4" stroke-width="1"/>
  <text class="s" x="40" y="446" fill="#454e55">If the answer was "a beach and a good dinner", the honest reply is: stay in Bali. It is popular for real reasons.</text>
</svg>
